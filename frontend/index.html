<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fórmula Íntima — lingerie e produtos íntimos, com entrega discreta em todo o Brasil." />
    <!--
      Open Graph / Twitter Card: controla como o link do site aparece quando
      colado no WhatsApp, Instagram ou Twitter/X (título, descrição e foto do
      card). Como o GitHub Pages só serve arquivo estático, essas tags são
      sempre as mesmas em qualquer página do site — não é possível cada
      produto ter seu próprio card sem um servidor por trás (ver observação
      sobre isso na conversa).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fórmula Íntima" />
    <meta property="og:title" content="Fórmula Íntima" />
    <meta property="og:description" content="Lingerie e produtos íntimos com entrega discreta em todo o Brasil." />
    <meta property="og:image" content="https://luizrique297.github.io/formula-intima/logo.png" />
    <meta property="og:url" content="https://luizrique297.github.io/formula-intima/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fórmula Íntima" />
    <meta name="twitter:description" content="Lingerie e produtos íntimos com entrega discreta em todo o Brasil." />
    <meta name="twitter:image" content="https://luizrique297.github.io/formula-intima/logo.png" />
    <!--
      Content-Security-Policy: trava de quais origens o navegador aceita carregar
      script/estilo/imagem/conexão, mesmo que algum código malicioso consiga se
      injetar na página (ex: uma dependência npm comprometida) — o navegador
      simplesmente recusa rodar ou buscar qualquer coisa fora desta lista.
      'self' = só o próprio domínio do site. O domínio abaixo é o do projeto
      Supabase (API, login, storage de imagens) — a única origem externa que o
      app realmente precisa.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://uzignwivxkigieccrmft.supabase.co; connect-src 'self' https://uzignwivxkigieccrmft.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <title>Fórmula Íntima</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
